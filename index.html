<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Egzamin</title><style>
body{font-family:system-ui;margin:0;background:#f4f6fa;color:#172033}main{max-width:900px;margin:auto;padding:24px 14px}.card{background:white;border:1px solid #ddd;border-radius:16px;padding:18px;margin:14px 0}button{padding:10px 14px;border:0;border-radius:10px;cursor:pointer;font-weight:700;margin:4px}button.primary{background:#315be8;color:white}button.secondary{background:#edf1f7}button.good{background:#dcfce7;border:1px solid #16a34a}button.bad{background:#fee2e2;border:1px solid #dc2626}.answer{display:block;width:100%;text-align:left;margin:9px 0}.hidden{display:none}.muted{color:#687386}input,select{padding:10px;border:1px solid #ccd4df;border-radius:9px;width:100%;box-sizing:border-box;margin:5px 0 12px}.row{display:flex;gap:8px;flex-wrap:wrap}.report.on{background:#dbeafe;color:#1d4ed8;border:1px solid #2563eb}.issue{border-top:1px solid #ddd;padding:12px 0}small{color:#687386}</style></head><body><main>
<h1>Egzamin</h1><p class="muted">Wspólna baza pytań · Supabase</p>
<section id="home" class="card"><h2>Rozpocznij test</h2><label>Liczba pytań</label><select id="count"><option value="20">20</option><option value="50">50</option><option value="100">100</option><option value="all">Wszystkie</option></select><button class="primary" id="start">Rozpocznij</button><button class="secondary" id="retry" disabled>Powtórz błędy</button><p id="status" class="muted">Łączenie…</p><b id="total">0</b> pytań w bazie</section>
<section id="quiz" class="card hidden"><small id="qn"></small><h2 id="q"></h2><div id="answers"></div><div id="feedback"></div><div class="row"><button class="report secondary" id="outdated">⚑ Nieaktualne</button><button class="report secondary" id="wrong">⚑ Błędne</button></div><input id="comment" maxlength="180" placeholder="Opcjonalny komentarz do zgłoszenia"><p id="reportStatus" class="muted"></p><button class="secondary" id="quit">Zakończ</button><button class="primary" id="next" disabled>Następne</button></section>
<section id="results" class="card hidden"><h2>Wynik</h2><h1 id="score">0%</h1><p id="resultText"></p><div id="review"></div><button class="primary" id="again">Nowy test</button><button class="secondary" id="resultRetry" disabled>Powtórz błędy</button></section>
<section class="card"><h2>Panel administratora</h2><div id="login"><input id="email" type="email" value="wojtekmark98@gmail.com"><input id="pass" type="password" placeholder="Hasło"><button class="primary" id="loginBtn">Zaloguj</button><button class="secondary" id="forgotBtn" type="button">Nie pamiętasz hasła?</button><p id="loginStatus" class="muted"></p></div><div id="passwordReset" class="hidden"><h3>Ustaw nowe hasło</h3><p class="muted">Link z wiadomości e-mail otworzył tryb zmiany hasła.</p><input id="newPass" type="password" minlength="6" placeholder="Nowe hasło"><input id="newPass2" type="password" minlength="6" placeholder="Powtórz nowe hasło"><button class="primary" id="saveNewPass" type="button">Zapisz nowe hasło</button><button class="secondary" id="cancelReset" type="button">Wróć</button><p id="resetStatus" class="muted"></p></div><div id="admin" class="hidden">
<form id="form"><input id="qt" placeholder="Treść pytania" required><input id="a" placeholder="A" required><input id="b" placeholder="B" required><input id="c" placeholder="C" required><input id="d" placeholder="D" required><label>Poprawna</label><select id="correct"><option value="0">A</option><option value="1">B</option><option value="2">C</option><option value="3">D</option></select><input id="num" type="number" min="1" placeholder="Numer (puste = kolejny)"><button class="primary">Dodaj pytanie</button></form><input id="search" placeholder="Szukaj"><div id="list"></div><h3>Zgłoszenia: <span id="issueCount">0</span></h3><div id="issues"></div><button class="secondary" id="logout">Wyloguj</button></div></section>
</main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const sb=supabase.createClient('https://fdkfipeulzcxkihzolrh.supabase.co','sb_publishable_rJy4dSm1boIXtUIL4JBE3A_0uJVbHfP'),$=x=>document.getElementById(x),L=['A','B','C','D'];let bank=[],session=[],i=0,chosen={},mistakes=new Set(),user=null,reports={};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function load(){let r=await sb.from('questions').select('*').order('number');if(r.error)throw r.error;bank=r.data||[];$('total').textContent=bank.length;$('status').textContent=bank.length?'Baza gotowa.':'Baza pusta — dodaj pytania jako administrator.';renderList()}
async function anon(){let s=await sb.auth.getSession();if(s.data.session){user=s.data.session.user;return}let r=await sb.auth.signInAnonymously();if(r.error){$('reportStatus').textContent='Aby zgłaszać pytania, włącz Anonymous Sign-Ins w Supabase.';return}user=r.data.user;await loadReports()}
async function loadReports(){if(!user)return;let r=await sb.from('issue_reports').select('*').eq('reporter_id',user.id).order('created_at');reports={};(r.data||[]).forEach(x=>reports[x.question_id+'|'+x.report_type]=x)}
function shuffle(a){for(let x=a.length-1;x;x--){let y=Math.floor(Math.random()*(x+1));[a[x],a[y]]=[a[y],a[x]]}return a}
function begin(retry=false){let p=retry?bank.filter(x=>mistakes.has(x.id)):shuffle([...bank]);if(!p.length)return;let n=$('count').value==='all'?p.length:+$('count').value;session=p.slice(0,n);i=0;chosen={};$('home').classList.add('hidden');$('results').classList.add('hidden');$('quiz').classList.remove('hidden');renderQ()}
function renderQ(){let x=session[i];$('qn').textContent='Pytanie '+(i+1)+' / '+session.length;$('q').textContent=x.text;$('answers').innerHTML='';$('feedback').innerHTML='';let y=chosen[x.id];x.option_a&&[x.option_a,x.option_b,x.option_c,x.option_d].forEach((v,k)=>{let b=document.createElement('button');b.className='answer secondary';b.innerHTML='<b>'+L[k]+'.</b> '+esc(v);if(y!==undefined){b.disabled=true;if(k===x.correct_answer)b.classList.add('good');if(k===y&&k!==x.correct_answer)b.classList.add('bad')}else b.onclick=()=>answer(k);$('answers').appendChild(b)});if(y!==undefined)$('feedback').textContent=y===x.correct_answer?'✓ Dobrze!':'✕ Źle. Poprawna odpowiedź: '+L[x.correct_answer]+'. '+x[['option_a','option_b','option_c','option_d'][x.correct_answer]];$('next').disabled=y===undefined;$('next').textContent=i===session.length-1?'Wynik →':'Następne →';['outdated','wrong'].forEach(t=>{let r=reports[x.id+'|'+t];$(t).classList.toggle('on',!!(r&&r.active))})}
function answer(k){let x=session[i];chosen[x.id]=k;if(k!==x.correct_answer)mistakes.add(x.id);else mistakes.delete(x.id);renderQ();$('retry').disabled=!mistakes.size}
function finish(){let good=session.filter(x=>chosen[x.id]===x.correct_answer).length;$('quiz').classList.add('hidden');$('results').classList.remove('hidden');$('score').textContent=Math.round(good/session.length*100)+'%';$('resultText').textContent=good+' / '+session.length+' poprawnych';$('resultRetry').disabled=!mistakes.size;$('review').innerHTML=session.map(x=>'<div class="issue"><b>'+esc(x.text)+'</b><br>Twoja: '+(chosen[x.id]===undefined?'brak':L[chosen[x.id]])+(chosen[x.id]!==x.correct_answer?'<br><span style="color:green">Poprawna: '+L[x.correct_answer]+'. '+esc(x[['option_a','option_b','option_c','option_d'][x.correct_answer]])+'</span>':'')+'</div>').join('')}
async function report(type){if(!user){$('reportStatus').textContent='Brak sesji.';return}let x=session[i],key=x.id+'|'+type,old=reports[key],r=await sb.from('issue_reports').insert({question_id:x.id,reporter_id:user.id,report_type:type,active:!(old&&old.active),comment:$('comment').value.trim()||null});if(r.error){$('reportStatus').textContent=r.error.message;return}await loadReports();renderQ();$('reportStatus').textContent=old&&old.active?'Zgłoszenie cofnięte — komentarz pozostaje w historii.':'Zgłoszenie zapisane.'}
function showReset(){document.querySelectorAll('main>section').forEach(s=>s.classList.add('hidden'));$('passwordReset').classList.remove('hidden')}async function sendReset(){let email=$('email').value.trim();if(!email){$('loginStatus').textContent='Wpisz adres e-mail administratora.';return}$('loginStatus').textContent='Wysyłanie wiadomości resetującej…';let r=await sb.auth.resetPasswordForEmail(email,{redirectTo:window.location.origin+window.location.pathname});$('loginStatus').textContent=r.error?'Nie udało się wysłać: '+r.error.message:'Wysłano wiadomość resetującą. Sprawdź pocztę.'}async function saveReset(){let p=$('newPass').value,p2=$('newPass2').value;if(p.length<6){$('resetStatus').textContent='Hasło musi mieć co najmniej 6 znaków.';return}if(p!==p2){$('resetStatus').textContent='Hasła nie są takie same.';return}$('resetStatus').textContent='Zapisywanie…';let r=await sb.auth.updateUser({password:p});if(r.error){$('resetStatus').textContent='Nie udało się zmienić hasła: '+r.error.message;return}$('resetStatus').textContent='Hasło zmienione. Możesz się teraz zalogować.';setTimeout(()=>location.reload(),1200)}async function login(){let r=await sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('pass').value});if(r.error){$('loginStatus').textContent=r.error.message;return}if(r.data.user.app_metadata?.role!=='admin'){await sb.auth.signOut();$('loginStatus').textContent='To konto nie ma uprawnień administratora.';return}user=r.data.user;$('login').classList.add('hidden');$('admin').classList.remove('hidden');await load();await renderIssues()}
async function add(e){e.preventDefault();let n=+$('num').value||Math.max(0,...bank.map(x=>x.number||0))+1;let r=await sb.from('questions').insert({number:n,text:$('qt').value.trim(),option_a:$('a').value.trim(),option_b:$('b').value.trim(),option_c:$('c').value.trim(),option_d:$('d').value.trim(),correct_answer:+$('correct').value});if(r.error)return alert(r.error.message);e.target.reset();await load()}
function renderList(){if(!$('admin')||$('admin').classList.contains('hidden'))return;let t=$('search').value.toLowerCase();$('list').innerHTML=bank.filter(x=>(x.text+' '+x.number).toLowerCase().includes(t)).map(x=>'<div class="issue"><b>#'+x.number+'</b> '+esc(x.text)+' <button onclick="del(\''+x.id+'\')">Usuń</button></div>').join('')}
async function del(id){if(!confirm('Usunąć pytanie?'))return;let r=await sb.from('questions').delete().eq('id',id);if(r.error)alert(r.error.message);await load();if(user&&!user.is_anonymous)await renderIssues()}
async function renderIssues(){let r=await sb.from('issue_reports').select('*').order('created_at');if(r.error)return;let active=0;$('issues').innerHTML='';let groups={};(r.data||[]).forEach(x=>{let k=x.question_id+'|'+x.reporter_id+'|'+x.report_type;(groups[k]??=[]).push(x)});Object.values(groups).forEach(h=>{let x=h[h.length-1];if(x.active)active++;let q=bank.find(q=>q.id===x.question_id);let d=document.createElement('div');d.className='issue';d.innerHTML='<b>#'+(q?q.number:'?')+' '+esc(q?q.text:'Pytanie usunięte')+'</b><br><small>'+x.report_type+' · '+(x.active?'AKTYWNE':'cofnięte')+'</small><details><summary>Komentarze ('+h.filter(z=>z.comment).length+')</summary>'+h.filter(z=>z.comment).map(z=>'<p>'+new Date(z.created_at).toLocaleString('pl-PL')+' — '+esc(z.comment)+'</p>').join('')+'</details>'+(q?'<button onclick="del(\''+q.id+'\').then(renderIssues)">Usuń pytanie</button>':'');$('issues').appendChild(d)});$('issueCount').textContent=active}
$('forgotBtn').onclick=sendReset;$('saveNewPass').onclick=saveReset;$('cancelReset').onclick=()=>location.reload();sb.auth.onAuthStateChange((event)=>{if(event==='PASSWORD_RECOVERY')showReset()});$('start').onclick=()=>begin();$('retry').onclick=()=>begin(true);$('resultRetry').onclick=()=>begin(true);$('again').onclick=()=>{$('results').classList.add('hidden');$('home').classList.remove('hidden')};$('next').onclick=()=>i<session.length-1?(i++,renderQ()):finish();$('quit').onclick=finish;$('outdated').onclick=()=>report('outdated');$('wrong').onclick=()=>report('wrong');$('loginBtn').onclick=login;$('form').onsubmit=add;$('search').oninput=renderList;$('logout').onclick=async()=>{await sb.auth.signOut();location.reload()};
(async()=>{try{await load();await anon();await loadReports()}catch(e){$('status').textContent='Błąd: '+e.message}})();
</script></body></html>
