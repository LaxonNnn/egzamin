name: Patch full exam results UI
on:
  push:
    branches: [improve-full-exam-results]
permissions:
  contents: write
jobs:
  patch:
    if: "!contains(github.event.head_commit.message, '[results-ui-patched]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index.html
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          css_old='.exam-summary{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.mode-back'
          css_new='.exam-summary{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.exam-result-pass{color:#22c55e}.exam-result-fail{color:#ef4444}.exam-summary .issue{border:1px solid #334155;border-radius:10px;padding:10px}.exam-summary .issue.pass{border-color:#16a34a;background:#0f2d20}.exam-summary .issue.fail{border-color:#dc2626;background:#351719}#fullExamReview{max-height:min(520px,62vh);overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;padding-right:10px;scrollbar-gutter:stable;scrollbar-width:thin;scrollbar-color:#64748b #1e293b;border-top:1px solid #334155;margin-top:14px}#fullExamReview::-webkit-scrollbar{width:10px}#fullExamReview::-webkit-scrollbar-track{background:#1e293b;border-radius:10px}#fullExamReview::-webkit-scrollbar-thumb{background:#64748b;border-radius:10px}#fullExamReview .issue{border:1px solid #334155;border-radius:10px;padding:10px;margin:8px 0}#fullExamReview .issue.correct{border-color:#16a34a;background:#0f2d20}#fullExamReview .issue.wrong{border-color:#dc2626;background:#351719}.mode-back'
          if css_old not in s: raise SystemExit('CSS anchor not found')
          s=s.replace(css_old,css_new,1)
          old="function finishFullExam(timeout=false){if(!timeout&&!confirm('Zakończyć egzamin i pokazać wynik?'))return;clearFullExamState();let good=fullExamSession.filter(q=>fullExamChosen[q.id]===q.correct_answer).length,blocks={};for(let b=1;b<=8;b++){let q=fullExamSession.filter(x=>x.block_id===b),g=q.filter(x=>fullExamChosen[x.id]===x.correct_answer).length;blocks[b]={g,total:q.length,pass:g>=EXAM_MIN[b]}}let pass=good>=75&&Object.values(blocks).every(x=>x.pass);showOnly('fullExamResults');$('fullExamScore').textContent=good+' / 100';$('fullExamResultText').textContent=(pass?'EGZAMIN ZDANY':'EGZAMIN NIEZDANY')+(timeout?' — czas minął.':'');$('fullExamSummary').innerHTML=Object.keys(blocks).map(b=>'<div class=\"issue\"><b>Blok '+b+'</b><br>'+blocks[b].g+' / '+blocks[b].total+' · min. '+EXAM_MIN[b]+' · '+(blocks[b].pass?'✓':'✕')+'</div>').join('');$('fullExamReview').innerHTML=fullExamSession.map((q,n)=>{let y=fullExamChosen[q.id],ok=y===q.correct_answer;return '<div class=\"issue\"><b>'+(n+1)+'. '+esc(q.text)+'</b><br>'+(ok?'✓':'✕')+' Odpowiedź: '+(y===undefined?'brak':L[y]+'. '+esc(q[['option_a','option_b','option_c','option_d'][y]]))+(!ok?'<br>Poprawna: '+L[q.correct_answer]+'. '+esc(q[['option_a','option_b','option_c','option_d'][q.correct_answer]]):'')+'</div>'}).join('')}"
          new="function finishFullExam(timeout=false){if(!timeout&&!confirm('Zakończyć egzamin i pokazać wynik?'))return;clearFullExamState();let good=fullExamSession.filter(q=>fullExamChosen[q.id]===q.correct_answer).length,blocks={};for(let b=1;b<=8;b++){let q=fullExamSession.filter(x=>x.block_id===b),g=q.filter(x=>fullExamChosen[x.id]===x.correct_answer).length,pct=Math.round(g/q.length*100),required=Math.ceil(EXAM_MIN[b]/q.length*100);blocks[b]={g,total:q.length,pct,required,pass:g>=EXAM_MIN[b]}}let overallPct=Math.round(good/fullExamSession.length*100),pass=good>=75&&Object.values(blocks).every(x=>x.pass);showOnly('fullExamResults');$('fullExamScore').className=pass?'exam-result-pass':'exam-result-fail';$('fullExamScore').textContent=good+' / 100 · '+overallPct+'% (wymagane: 75%)';$('fullExamResultText').className=pass?'exam-result-pass':'exam-result-fail';$('fullExamResultText').textContent=(pass?'EGZAMIN ZDANY':'EGZAMIN NIEZDANY')+(timeout?' — czas minął.':'');$('fullExamSummary').innerHTML=Object.keys(blocks).map(b=>'<div class=\"issue '+(blocks[b].pass?'pass':'fail')+'\"><b>Blok '+b+' — '+esc(BLOCKS[b])+'</b><br>'+blocks[b].g+' / '+blocks[b].total+' · <b>'+blocks[b].pct+'%</b> · wymagane: '+blocks[b].required+'% ('+EXAM_MIN[b]+'/'+blocks[b].total+') · '+(blocks[b].pass?'✓ ZALICZONY':'✕ NIEZALICZONY')+'</div>').join('');$('fullExamReview').innerHTML=fullExamSession.map((q,n)=>{let y=fullExamChosen[q.id],ok=y===q.correct_answer;return '<div class=\"issue '+(ok?'correct':'wrong')+'\"><b>'+(n+1)+'. '+esc(q.text)+'</b><br>'+(ok?'✓ Poprawna':'✕ Błędna')+' odpowiedź: '+(y===undefined?'brak':L[y]+'. '+esc(q[['option_a','option_b','option_c','option_d'][y]]))+(!ok?'<br>Poprawna: '+L[q.correct_answer]+'. '+esc(q[['option_a','option_b','option_c','option_d'][q.correct_answer]]):'')+'</div>'}).join('');$('fullExamReview').scrollTop=0}"
          if old not in s: raise SystemExit('finishFullExam anchor not found')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Improve full exam results UI [results-ui-patched]"
          git push
