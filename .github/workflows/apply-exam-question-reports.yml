name: Apply exam question reports
on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-exam-question-reports.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/exam-question-reports
      - name: Apply patch
        run: python3 scripts/patch_exam_reports.py
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git commit -m "Add reports and comments to thematic questions"
          git push origin HEAD:feature/exam-question-reports
