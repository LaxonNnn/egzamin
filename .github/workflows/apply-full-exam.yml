name: Apply full exam and navigation patch
on: workflow_dispatch
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/full-exam-and-navigation-fixes
      - name: Patch index.html
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          s=s.replace("@media(max-width:800px){.block-grid{grid-template-columns:1fr}{.admin-layout,.exam-admin-grid{grid-template-columns:1fr}.issues-panel{position:static}}", "@media(max-width:800px){.block-grid{grid-template-columns:1fr}.admin-layout,.exam-admin-grid{grid-template-columns:1fr}.issues-panel{position:static}}")
          s=s.replace(".block-results .issue{padding:10px 0}", ".block-results .issue{padding:10px 0}.exam-shell{display:grid;grid-template-columns:minmax(0,1fr) 230px;gap:16px}.exam-nav{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;max-height:420px;overflow:auto}.exam-nav button{padding:7px 4px;margin:0}.exam-nav button.done{background:#315be8;color:#fff}.exam-nav button.current{outline:2px solid #fff}.exam-timer{font-size:24px;font-weight:800}.exam-summary{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.exam-summary .issue{border:1px solid #334155;border-radius:10px;padding:10px}.mode-back{margin-bottom:12px}@media(max-width:800px){.exam-shell{grid-template-columns:1fr}.exam-nav{grid-template-columns:repeat(10,1fr);max-height:none}.exam-summary{grid-template-columns:1fr}}")
          old='<section id="blockQuiz" class="card hidden"><div class="block-progress"><div><small id="blockQuizLabel"></small><br><b id="blockQuizProgress"></b></div><button class="secondary" id="blockQuizExit" type="button">Zakończ test</button></div><h2 id="blockQuizQuestion"></h2><div id="blockQuizAnswers"></div><div id="blockQuizFeedback"></div><div class="quiz-actions"><button class="primary" id="blockQuizNext" type="button" disabled>Następne →</button></div></section>'
          new='<section id="blockQuiz" class="card hidden"><button class="secondary mode-back" id="blockQuizHome" type="button">← Wróć do wyboru testu</button><div class="block-progress"><div><small id="blockQuizLabel"></small><br><b id="blockQuizProgress"></b></div><button class="primary" id="blockQuizExit" type="button">Zakończ i pokaż wynik</button></div><h2 id="blockQuizQuestion"></h2><div id="blockQuizAnswers"></div><div id="blockQuizFeedback"></div><div class="quiz-actions"><button class="primary" id="blockQuizNext" type="button" disabled>Następne →</button></div></section>'
          s=s.replace(old,new)
          marker='<section id="quiz" class="card hidden">'
          exam='''<section id="fullExam" class="card hidden"><button class="secondary mode-back" id="fullExamHome" type="button">← Przerwij i wróć</button><div class="block-progress"><div><small>Pełny egzamin · 100 pytań</small><br><b id="fullExamProgress">Pytanie 1 / 100</b></div><div><span class="muted">Pozostały czas</span><br><span id="fullExamTimer" class="exam-timer">03:20:00</span></div></div><div class="exam-shell"><div><small id="fullExamBlock"></small><h2 id="fullExamQuestion"></h2><div id="fullExamAnswers"></div><div class="quiz-actions"><button class="secondary" id="fullExamPrev" type="button">← Poprzednie</button><button class="primary" id="fullExamNext" type="button">Następne →</button><button class="danger" id="fullExamFinish" type="button">Zakończ egzamin</button></div></div><aside><p class="muted">Nawigacja po pytaniach</p><div id="fullExamNav" class="exam-nav"></div></aside></div></section><section id="fullExamResults" class="card hidden"><h2>Wynik pełnego egzaminu</h2><h1 id="fullExamScore">0%</h1><p id="fullExamResultText"></p><div id="fullExamSummary" class="exam-summary"></div><div id="fullExamReview"></div><button class="primary" id="fullExamAgain" type="button">Nowy egzamin</button><button class="secondary" id="fullExamResultHome" type="button">Wróć do strony głównej</button></section>'''
          s=s.replace(marker,exam+marker)
          s=s.replace("const EXAM_QUOTAS={1:6,2:5,3:35,4:8,5:25,6:3,7:3,8:15};let blockSession=[],blockIndex=0,blockChosen={},activeBlockId=null;", "const EXAM_QUOTAS={1:6,2:5,3:35,4:8,5:25,6:3,7:3,8:15},EXAM_MIN={1:3,2:3,3:18,4:4,5:13,6:2,7:2,8:15},EXAM_MS=200*60*1000,EXAM_STATE_KEY='full_exam_state_v1';let blockSession=[],blockIndex=0,blockChosen={},activeBlockId=null,fullExamSession=[],fullExamIndex=0,fullExamChosen={},fullExamDeadline=0,fullExamTimerHandle=null;")
          old="function startBlockTest(blockId){let rows=examBank.filter(q=>q.block_id===blockId);if(!rows.length)return;activeBlockId=blockId;blockSession=shuffle([...rows]).map(prepareExamQuestion);blockIndex=0;blockChosen={};$('newExamHome').classList.add('hidden');$('home').classList.add('hidden');$('results').classList.add('hidden');$('blockResults').classList.add('hidden');$('blockQuiz').classList.remove('hidden');renderBlockQuestion();window.scrollTo({top:0,behavior:'smooth'})}"
          new="function startBlockTest(blockId){let rows=examBank.filter(q=>q.block_id===blockId);if(!rows.length)return;let raw=prompt('Ile pytań? Wpisz 20, 50, 100 lub wszystkie.','20');if(raw===null)return;raw=raw.trim().toLowerCase();let wanted=raw==='wszystkie'||raw==='all'?rows.length:Number(raw);if(![20,50,100].includes(wanted)&&wanted!==rows.length){alert('Wybierz 20, 50, 100 lub wszystkie.');return}wanted=Math.min(wanted,rows.length);activeBlockId=blockId;blockSession=shuffle([...rows]).slice(0,wanted).map(prepareExamQuestion);blockIndex=0;blockChosen={};showOnly('blockQuiz');renderBlockQuestion();window.scrollTo({top:0,behavior:'smooth'})}"
          s=s.replace(old,new)
          insert="""
function allMainSections(){return ['home','newExamHome','blockQuiz','blockResults','quiz','results','fullExam','fullExamResults']}
function showOnly(id){allMainSections().forEach(x=>{let e=$(x);if(e)e.classList.toggle('hidden',x!==id)})}
function showHome(){allMainSections().forEach(x=>{let e=$(x);if(e)e.classList.add('hidden')});$('home').classList.remove('hidden');$('newExamHome').classList.remove('hidden');window.scrollTo({top:0,behavior:'smooth'})}
function finishBlockEarly(){if(!blockSession.length)return;if(!confirm('Zakończyć test teraz i pokazać wynik? Nieudzielone odpowiedzi będą pokazane jako brak odpowiedzi.'))return;finishBlockTest()}
function buildFullExam(){let out=[];for(let b=1;b<=8;b++){let rows=shuffle(examBank.filter(q=>q.block_id===b));if(rows.length<EXAM_QUOTAS[b])return null;out.push(...rows.slice(0,EXAM_QUOTAS[b]).map(prepareExamQuestion))}return shuffle(out)}
function saveFullExamState(){if(!fullExamSession.length)return;localStorage.setItem(EXAM_STATE_KEY,JSON.stringify({ids:fullExamSession.map(q=>q.id),chosen:fullExamChosen,index:fullExamIndex,deadline:fullExamDeadline}))}
function clearFullExamState(){localStorage.removeItem(EXAM_STATE_KEY);if(fullExamTimerHandle){clearInterval(fullExamTimerHandle);fullExamTimerHandle=null}}
function startFullExam(){let built=buildFullExam();if(!built){alert('Brakuje wymaganej liczby pytań w co najmniej jednym bloku.');return}fullExamSession=built;fullExamIndex=0;fullExamChosen={};fullExamDeadline=Date.now()+EXAM_MS;saveFullExamState();showOnly('fullExam');renderFullExam();startFullExamTimer();window.scrollTo({top:0,behavior:'smooth'})}
function restoreFullExam(){let raw=localStorage.getItem(EXAM_STATE_KEY);if(!raw)return false;try{let st=JSON.parse(raw),map=new Map(examBank.map(q=>[q.id,q])),rows=(st.ids||[]).map(id=>map.get(id)).filter(Boolean);if(rows.length!==100){clearFullExamState();return false}fullExamSession=rows;fullExamChosen=st.chosen||{};fullExamIndex=Math.max(0,Math.min(99,st.index||0));fullExamDeadline=st.deadline||0;if(fullExamDeadline<=Date.now()){finishFullExam(true);return true}showOnly('fullExam');renderFullExam();startFullExamTimer();return true}catch(e){clearFullExamState();return false}}
function startFullExamTimer(){if(fullExamTimerHandle)clearInterval(fullExamTimerHandle);let tick=()=>{let left=Math.max(0,fullExamDeadline-Date.now()),sec=Math.ceil(left/1000),h=Math.floor(sec/3600),m=Math.floor(sec%3600/60),s=sec%60;$('fullExamTimer').textContent=[h,m,s].map(x=>String(x).padStart(2,'0')).join(':');if(left<=0)finishFullExam(true)};tick();fullExamTimerHandle=setInterval(tick,1000)}
function renderFullExam(){let q=fullExamSession[fullExamIndex];if(!q)return;$('fullExamProgress').textContent='Pytanie '+(fullExamIndex+1)+' / 100';$('fullExamBlock').textContent='Blok '+q.block_id+' — '+BLOCKS[q.block_id];$('fullExamQuestion').textContent=q.text;$('fullExamAnswers').innerHTML='';let y=fullExamChosen[q.id];[q.option_a,q.option_b,q.option_c,q.option_d].forEach((v,k)=>{let b=document.createElement('button');b.className='answer secondary';b.innerHTML='<b>'+L[k]+'.</b> '+esc(v);if(y===k)b.classList.add('primary');b.onclick=()=>{fullExamChosen[q.id]=k;saveFullExamState();renderFullExam()};$('fullExamAnswers').appendChild(b)});$('fullExamPrev').disabled=fullExamIndex===0;$('fullExamNext').disabled=fullExamIndex===99;$('fullExamNav').innerHTML=fullExamSession.map((x,n)=>'<button type="button" class="secondary '+(fullExamChosen[x.id]!==undefined?'done ':'')+(n===fullExamIndex?'current':'')+'" onclick="goFullExam('+n+')">'+(n+1)+'</button>').join('')}
function goFullExam(n){fullExamIndex=n;saveFullExamState();renderFullExam();window.scrollTo({top:0,behavior:'smooth'})}
function finishFullExam(timeout=false){if(!fullExamSession.length)return;if(!timeout){let unanswered=fullExamSession.filter(q=>fullExamChosen[q.id]===undefined).length;if(!confirm('Zakończyć egzamin?'+(unanswered?' Bez odpowiedzi: '+unanswered+'.':'')))return}clearFullExamState();let good=fullExamSession.filter(q=>fullExamChosen[q.id]===q.correct_answer).length,passedTotal=good>=75,blocks={};for(let b=1;b<=8;b++){let qs=fullExamSession.filter(q=>q.block_id===b),g=qs.filter(q=>fullExamChosen[q.id]===q.correct_answer).length;blocks[b]={good:g,total:qs.length,pass:g>=EXAM_MIN[b]}}let passed=passedTotal&&Object.values(blocks).every(x=>x.pass);showOnly('fullExamResults');$('fullExamScore').textContent=good+' / 100';$('fullExamResultText').innerHTML=(passed?'<b>EGZAMIN ZDANY</b>':'<b>EGZAMIN NIEZDANY</b>')+(timeout?' — czas minął.':'')+' Wynik ogólny: '+good+'%. Wymagane minimum: 75/100 oraz minima w każdym bloku.';$('fullExamSummary').innerHTML=Object.keys(blocks).map(b=>'<div class="issue"><b>Blok '+b+'</b><br>'+blocks[b].good+' / '+blocks[b].total+' · minimum '+EXAM_MIN[b]+' · '+(blocks[b].pass?'✓ zaliczony':'✕ niezaliczony')+'</div>').join('');$('fullExamReview').innerHTML=fullExamSession.map((q,n)=>{let y=fullExamChosen[q.id],ok=y===q.correct_answer,ans=y===undefined?'brak odpowiedzi':L[y]+'. '+esc(q[['option_a','option_b','option_c','option_d'][y]]);return '<div class="issue"><b>'+(n+1)+'. '+esc(q.text)+'</b><br><span>'+(ok?'✓':'✕')+' Twoja odpowiedź: '+ans+'</span>'+(!ok?'<br><span>Poprawna: '+L[q.correct_answer]+'. '+esc(q[['option_a','option_b','option_c','option_d'][q.correct_answer]])+'</span>':'')+'</div>'}).join('');window.scrollTo({top:0,behavior:'smooth'})}
function abortFullExam(){if(!confirm('Przerwać egzamin? Bieżący postęp zostanie usunięty.'))return;clearFullExamState();fullExamSession=[];fullExamChosen={};showHome()}
"""
          anchor='function questionWord(n){'
          s=s.replace(anchor,insert+'\n'+anchor)
          s=s.replace("$('start').onclick=()=>begin();", "$('start').onclick=()=>{begin();$('newExamHome').classList.add('hidden');window.scrollTo({top:0,behavior:'smooth'})};")
          s=s.replace("$('again').onclick=()=>{$('results').classList.add('hidden');$('home').classList.remove('hidden')};", "$('again').onclick=showHome;")
          s=s.replace("$('blockQuizExit').onclick=finishBlockTest;", "$('blockQuizExit').onclick=finishBlockEarly;$('blockQuizHome').onclick=()=>{if(confirm('Przerwać test i wrócić do wyboru?'))showHome()};")
          s=s.replace("$('blockResultHome').onclick=()=>{$('blockResults').classList.add('hidden');$('newExamHome').classList.remove('hidden');$('home').classList.remove('hidden');window.scrollTo({top:0,behavior:'smooth'})};", "$('blockResultHome').onclick=showHome;")
          hook="$('fullExamStart').onclick=startFullExam;$('fullExamPrev').onclick=()=>goFullExam(fullExamIndex-1);$('fullExamNext').onclick=()=>goFullExam(fullExamIndex+1);$('fullExamFinish').onclick=()=>finishFullExam(false);$('fullExamHome').onclick=abortFullExam;$('fullExamAgain').onclick=startFullExam;$('fullExamResultHome').onclick=showHome;"
          s=s.replace("$('logout').onclick=async()=>{", hook+"$('logout').onclick=async()=>{")
          s=s.replace("await load();await loadExamQuestions();await anon();", "await load();await loadExamQuestions();restoreFullExam();await anon();")
          p.write_text(s)
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git commit -m "Add full exam and improve test navigation"
