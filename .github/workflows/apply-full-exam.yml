name: Apply full exam and navigation patch
on:
  push:
    branches: [feature/full-exam-and-navigation-fixes]
    paths: [.github/workflows/apply-full-exam.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/full-exam-and-navigation-fixes
      - name: Patch index.html
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html');s=p.read_text()
          s=s.replace("@media(max-width:800px){.block-grid{grid-template-columns:1fr}{.admin-layout,.exam-admin-grid{grid-template-columns:1fr}.issues-panel{position:static}}","@media(max-width:800px){.block-grid{grid-template-columns:1fr}.admin-layout,.exam-admin-grid{grid-template-columns:1fr}.issues-panel{position:static}}")
          s=s.replace(".block-results .issue{padding:10px 0}",".block-results .issue{padding:10px 0}.exam-shell{display:grid;grid-template-columns:minmax(0,1fr) 230px;gap:16px}.exam-nav{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}.exam-nav button{padding:7px 4px;margin:0}.exam-nav button.done{background:#315be8;color:#fff}.exam-nav button.current{outline:2px solid #fff}.exam-timer{font-size:24px;font-weight:800}.exam-summary{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.mode-back{margin-bottom:12px}")
          s=s.replace('<section id="blockQuiz" class="card hidden"><div class="block-progress"><div><small id="blockQuizLabel"></small><br><b id="blockQuizProgress"></b></div><button class="secondary" id="blockQuizExit" type="button">Zakończ test</button></div>','<section id="blockQuiz" class="card hidden"><button class="secondary mode-back" id="blockQuizHome" type="button">← Wróć do wyboru testu</button><div class="block-progress"><div><small id="blockQuizLabel"></small><br><b id="blockQuizProgress"></b></div><button class="primary" id="blockQuizExit" type="button">Zakończ i pokaż wynik</button></div>')
          marker='<section id="quiz" class="card hidden">'
          exam='<section id="fullExam" class="card hidden"><button class="secondary mode-back" id="fullExamHome" type="button">← Przerwij i wróć</button><div class="block-progress"><div><small>Pełny egzamin · 100 pytań</small><br><b id="fullExamProgress"></b></div><div><span class="muted">Pozostały czas</span><br><span id="fullExamTimer" class="exam-timer">03:20:00</span></div></div><div class="exam-shell"><div><small id="fullExamBlock"></small><h2 id="fullExamQuestion"></h2><div id="fullExamAnswers"></div><div class="quiz-actions"><button class="secondary" id="fullExamPrev" type="button">← Poprzednie</button><button class="primary" id="fullExamNext" type="button">Następne →</button><button class="danger" id="fullExamFinish" type="button">Zakończ egzamin</button></div></div><aside><p class="muted">Pytania</p><div id="fullExamNav" class="exam-nav"></div></aside></div></section><section id="fullExamResults" class="card hidden"><h2>Wynik pełnego egzaminu</h2><h1 id="fullExamScore"></h1><p id="fullExamResultText"></p><div id="fullExamSummary" class="exam-summary"></div><div id="fullExamReview"></div><button class="primary" id="fullExamAgain">Nowy egzamin</button><button class="secondary" id="fullExamResultHome">Wróć</button></section>'
          if 'id="fullExam"' not in s:s=s.replace(marker,exam+marker)
          s=s.replace("const EXAM_QUOTAS={1:6,2:5,3:35,4:8,5:25,6:3,7:3,8:15};let blockSession=[],blockIndex=0,blockChosen={},activeBlockId=null;","const EXAM_QUOTAS={1:6,2:5,3:35,4:8,5:25,6:3,7:3,8:15},EXAM_MIN={1:3,2:3,3:18,4:4,5:13,6:2,7:2,8:15},EXAM_MS=12000000,EXAM_STATE_KEY='full_exam_state_v1';let blockSession=[],blockIndex=0,blockChosen={},activeBlockId=null,fullExamSession=[],fullExamIndex=0,fullExamChosen={},fullExamDeadline=0,fullExamTimerHandle=null;")
          s=s.replace("function startBlockTest(blockId){let rows=examBank.filter(q=>q.block_id===blockId);if(!rows.length)return;activeBlockId=blockId;blockSession=shuffle([...rows]).map(prepareExamQuestion);blockIndex=0;blockChosen={};$('newExamHome').classList.add('hidden');$('home').classList.add('hidden');$('results').classList.add('hidden');$('blockResults').classList.add('hidden');$('blockQuiz').classList.remove('hidden');renderBlockQuestion();window.scrollTo({top:0,behavior:'smooth'})}","function startBlockTest(blockId){let rows=examBank.filter(q=>q.block_id===blockId);if(!rows.length)return;let raw=prompt('Liczba pytań: 20, 50, 100 lub wszystkie','20');if(raw===null)return;raw=raw.trim().toLowerCase();let wanted=(raw==='wszystkie'||raw==='all')?rows.length:Number(raw);if(![20,50,100].includes(wanted)&&wanted!==rows.length){alert('Wybierz 20, 50, 100 lub wszystkie.');return}wanted=Math.min(wanted,rows.length);activeBlockId=blockId;blockSession=shuffle([...rows]).slice(0,wanted).map(prepareExamQuestion);blockIndex=0;blockChosen={};showOnly('blockQuiz');renderBlockQuestion();window.scrollTo({top:0,behavior:'smooth'})}")
          anchor='function questionWord(n){'
          funcs="""function allMainSections(){return ['home','newExamHome','blockQuiz','blockResults','quiz','results','fullExam','fullExamResults']}function showOnly(id){allMainSections().forEach(x=>{let e=$(x);if(e)e.classList.toggle('hidden',x!==id)})}function showHome(){allMainSections().forEach(x=>{let e=$(x);if(e)e.classList.add('hidden')});$('home').classList.remove('hidden');$('newExamHome').classList.remove('hidden');window.scrollTo({top:0,behavior:'smooth'})}function finishBlockEarly(){if(confirm('Zakończyć teraz i pokazać wynik?'))finishBlockTest()}function buildFullExam(){let out=[];for(let b=1;b<=8;b++){let rows=shuffle(examBank.filter(q=>q.block_id===b));if(rows.length<EXAM_QUOTAS[b])return null;out.push(...rows.slice(0,EXAM_QUOTAS[b]).map(prepareExamQuestion))}return shuffle(out)}function saveFullExamState(){localStorage.setItem(EXAM_STATE_KEY,JSON.stringify({ids:fullExamSession.map(q=>q.id),chosen:fullExamChosen,index:fullExamIndex,deadline:fullExamDeadline}))}function clearFullExamState(){localStorage.removeItem(EXAM_STATE_KEY);if(fullExamTimerHandle)clearInterval(fullExamTimerHandle);fullExamTimerHandle=null}function startFullExam(){let x=buildFullExam();if(!x)return alert('Brakuje pytań w co najmniej jednym bloku.');fullExamSession=x;fullExamIndex=0;fullExamChosen={};fullExamDeadline=Date.now()+EXAM_MS;saveFullExamState();showOnly('fullExam');renderFullExam();startFullExamTimer()}function startFullExamTimer(){if(fullExamTimerHandle)clearInterval(fullExamTimerHandle);let tick=()=>{let sec=Math.max(0,Math.ceil((fullExamDeadline-Date.now())/1000)),h=Math.floor(sec/3600),m=Math.floor(sec%3600/60),z=sec%60;$('fullExamTimer').textContent=[h,m,z].map(x=>String(x).padStart(2,'0')).join(':');if(sec<=0)finishFullExam(true)};tick();fullExamTimerHandle=setInterval(tick,1000)}function renderFullExam(){let q=fullExamSession[fullExamIndex];$('fullExamProgress').textContent='Pytanie '+(fullExamIndex+1)+' / 100';$('fullExamBlock').textContent='Blok '+q.block_id+' — '+BLOCKS[q.block_id];$('fullExamQuestion').textContent=q.text;$('fullExamAnswers').innerHTML='';let y=fullExamChosen[q.id];[q.option_a,q.option_b,q.option_c,q.option_d].forEach((v,k)=>{let b=document.createElement('button');b.className='answer secondary';b.innerHTML='<b>'+L[k]+'.</b> '+esc(v);if(y===k)b.classList.add('primary');b.onclick=()=>{fullExamChosen[q.id]=k;saveFullExamState();renderFullExam()};$('fullExamAnswers').appendChild(b)});$('fullExamPrev').disabled=fullExamIndex===0;$('fullExamNext').disabled=fullExamIndex===99;$('fullExamNav').innerHTML=fullExamSession.map((q,n)=>'<button class=\"secondary '+(fullExamChosen[q.id]!==undefined?'done ':'')+(n===fullExamIndex?'current':'')+'\" onclick=\"goFullExam('+n+')\">'+(n+1)+'</button>').join('')}function goFullExam(n){if(n<0||n>99)return;fullExamIndex=n;saveFullExamState();renderFullExam()}function finishFullExam(timeout=false){if(!timeout&&!confirm('Zakończyć egzamin i pokazać wynik?'))return;clearFullExamState();let good=fullExamSession.filter(q=>fullExamChosen[q.id]===q.correct_answer).length,blocks={};for(let b=1;b<=8;b++){let q=fullExamSession.filter(x=>x.block_id===b),g=q.filter(x=>fullExamChosen[x.id]===x.correct_answer).length;blocks[b]={g,total:q.length,pass:g>=EXAM_MIN[b]}}let pass=good>=75&&Object.values(blocks).every(x=>x.pass);showOnly('fullExamResults');$('fullExamScore').textContent=good+' / 100';$('fullExamResultText').textContent=(pass?'EGZAMIN ZDANY':'EGZAMIN NIEZDANY')+(timeout?' — czas minął.':'');$('fullExamSummary').innerHTML=Object.keys(blocks).map(b=>'<div class=\"issue\"><b>Blok '+b+'</b><br>'+blocks[b].g+' / '+blocks[b].total+' · min. '+EXAM_MIN[b]+' · '+(blocks[b].pass?'✓':'✕')+'</div>').join('');$('fullExamReview').innerHTML=fullExamSession.map((q,n)=>{let y=fullExamChosen[q.id],ok=y===q.correct_answer;return '<div class=\"issue\"><b>'+(n+1)+'. '+esc(q.text)+'</b><br>'+(ok?'✓':'✕')+' Odpowiedź: '+(y===undefined?'brak':L[y]+'. '+esc(q[['option_a','option_b','option_c','option_d'][y]]))+(!ok?'<br>Poprawna: '+L[q.correct_answer]+'. '+esc(q[['option_a','option_b','option_c','option_d'][q.correct_answer]]):'')+'</div>'}).join('')}function abortFullExam(){if(confirm('Przerwać egzamin? Postęp zostanie usunięty.')){clearFullExamState();showHome()}}"""
          if 'function allMainSections()' not in s:s=s.replace(anchor,funcs+anchor)
          s=s.replace("$('start').onclick=()=>begin();","$('start').onclick=()=>{begin();$('newExamHome').classList.add('hidden');window.scrollTo({top:0,behavior:'smooth'})};")
          s=s.replace("$('again').onclick=()=>{$('results').classList.add('hidden');$('home').classList.remove('hidden')};","$('again').onclick=showHome;")
          s=s.replace("$('blockQuizExit').onclick=finishBlockTest;","$('blockQuizExit').onclick=finishBlockEarly;$('blockQuizHome').onclick=()=>{if(confirm('Przerwać test i wrócić?'))showHome()};")
          s=s.replace("$('blockResultHome').onclick=()=>{$('blockResults').classList.add('hidden');$('newExamHome').classList.remove('hidden');$('home').classList.remove('hidden');window.scrollTo({top:0,behavior:'smooth'})};","$('blockResultHome').onclick=showHome;")
          hook="$('fullExamStart').onclick=startFullExam;$('fullExamPrev').onclick=()=>goFullExam(fullExamIndex-1);$('fullExamNext').onclick=()=>goFullExam(fullExamIndex+1);$('fullExamFinish').onclick=()=>finishFullExam(false);$('fullExamHome').onclick=abortFullExam;$('fullExamAgain').onclick=startFullExam;$('fullExamResultHome').onclick=showHome;"
          s=s.replace("$('logout').onclick=async()=>{",hook+"$('logout').onclick=async()=>{")
          p.write_text(s)
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git commit -m "Add full exam and improve test navigation" || exit 0
          git push origin HEAD:feature/full-exam-and-navigation-fixes
